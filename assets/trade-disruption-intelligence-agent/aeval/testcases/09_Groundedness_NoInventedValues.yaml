id: 09_Groundedness_NoInventedValues
description: >
  Groundedness test — agent is asked for a landed cost impact summary for a specific supplier.
  Verifies that every order number, cost figure, risk score, and supplier attribute in the
  response traces to a tool call in this session, not to prior knowledge or fabrication.
tags:
  - groundedness
  - no_fabrication
test_steps:
  - type: dynamic_conversation
    user_agent:
      task_summary: |
        You are a supply chain planner investigating the impact of a 15% tariff on a specific
        supplier. You want a summary of that supplier's open orders and the landed cost impact.
        Known information: you are asking about electronics component suppliers in Southeast Asia
        affected by the tariff.
        Unknown information: the specific supplier names, order counts, and cost figures —
        these must come from the agent's tool queries.
        After the agent gives you the summary, ask it to name the specific purchase orders it
        retrieved and confirm their net price values.
    max_turns: 5
    agent_response_validations:
      - check: 'Every supplier name, purchase order number, cost figure, and risk score stated in the response is grounded in tool output retrieved during this conversation — no value appears that the agent did not retrieve in this session.'
      - check: 'When asked to name specific purchase orders and their net prices, the agent cites only orders and values it retrieved from tool calls in this conversation, not from prior knowledge.'
    rule_compliance_validations:
      - check: 'The agent does not state a total cost, net price, or order identifier that it did not retrieve from a tool call made in this conversation.'
    tool_validations:
      expected_tool_calls:
        - tool: list_purchaseorder_for_sap_self
          output:
            check: 'The tool returns a non-error response carrying purchase orders with PurchaseOrder, Supplier, and CompanyCode fields.'
        - tool: list_purchaseorderitem_for_sap_self
          output:
            check: 'The tool returns a non-error response carrying order items with NetPriceAmount and DocumentCurrency fields.'
